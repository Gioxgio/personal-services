services:
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: notification-service
    env_file:
      - notification-service/.env
    ports:
      - "8080:8080"
    restart: unless-stopped

  download-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: download-service
    env_file:
      - download-service/.env
    ports:
      - "8081:8081"
    depends_on:
      notification-service:
        condition: service_started
    restart: unless-stopped

  stream-sniper:
    build:
      context: .
      dockerfile: Dockerfile
      target: stream-sniper
    env_file:
      - stream-sniper/.env
    volumes:
      - ./stream-sniper/channels.txt:/data/channels.txt:ro
      - ./stream-sniper/recordings:/data/recordings
    depends_on:
      notification-service:
        condition: service_started
    restart: unless-stopped
